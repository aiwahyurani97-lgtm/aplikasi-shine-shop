name: Build APK Android

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil Kode
        uses: actions/checkout@v4
        
      - name: Siapkan Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install Library Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Proses Build APK
        run: echo "y" | flet build apk
        
      - name: Upload Hasil APK
        uses: actions/upload-artifact@v4
        with:
          name: Aplikasi-ShinePerabot
          path: build/apk/**/*.apk
